<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>비행기 회피 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { user-select: none; touch-action: manipulation; }
        body { margin: 0; overflow: hidden; background: #090d16; color: white; font-family: 'Pretendard', sans-serif; }
        #game-canvas { display: block; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%); }
        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); }
        .hud { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
        .hud-btn { pointer-events: auto; }
        .touch-btn { background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; active: background: rgba(255, 255, 255, 0.4); }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <!-- In-game HUD Header -->
    <div id="hud" class="hud hidden">
        <div class="bg-slate-900/80 border border-slate-700/80 backdrop-blur px-4 py-2 rounded-xl flex gap-6 text-sm sm:text-base font-semibold shadow-lg">
            <span class="text-blue-400">점수: <span id="score-text" class="text-white">0</span></span>
            <span class="text-yellow-400">최고: <span id="highscore-text" class="text-white">0</span></span>
        </div>
        <button id="in-game-quit-btn" class="hud-btn bg-red-600/90 hover:bg-red-500 text-white font-bold px-4 py-2 rounded-xl text-sm transition-all shadow-lg active:scale-95 border border-red-400/40">
            포기하기 🛑
        </button>
    </div>

    <!-- On-screen Touch Controls for Mobile -->
    <div id="mobile-controls" class="absolute bottom-6 left-1/2 -translate-x-1/2 grid grid-cols-3 gap-3 sm:hidden z-20">
        <div></div>
        <button class="touch-btn w-14 h-14" data-key="ArrowUp">⬆️</button>
        <div></div>
        <button class="touch-btn w-14 h-14" data-key="ArrowLeft">⬅️</button>
        <button class="touch-btn w-14 h-14" data-key="ArrowDown">⬇️</button>
        <button class="touch-btn w-14 h-14" data-key="ArrowRight">➡️</button>
    </div>

    <!-- Start & Game Over Menu Overlay -->
    <div id="ui" class="ui-overlay z-30">
        <div class="bg-slate-900/90 border border-slate-700 p-8 rounded-3xl max-w-md w-11/12 text-center shadow-2xl backdrop-blur-md">
            <div class="text-5xl mb-4">✈️💥</div>
            <h1 id="menu-title" class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300 mb-2">전투기 회피 작전</h1>
            <p id="menu-desc" class="text-slate-300 text-sm mb-6">다가오는 정밀 유도 미사일을 피하세요!<br>방향키 또는 터치 조작을 사용하세요.</p>
            
            <div id="ai-comment-box" class="hidden mb-6 p-4 bg-slate-800/80 border border-purple-500/50 rounded-2xl text-purple-200 text-sm italic shadow-inner">
                <span id="ai-msg">AI 중계진이 멘트를 준비 중입니다...</span>
            </div>

            <div class="flex flex-col gap-3">
                <button id="start-btn" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold py-3.5 px-6 rounded-xl text-lg transition-all shadow-lg hover:scale-[1.02] active:scale-95">
                    작전 개시 (START)
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const hud = document.getElementById('hud');
        const scoreText = document.getElementById('score-text');
        const highscoreText = document.getElementById('highscore-text');
        const ui = document.getElementById('ui');
        const startBtn = document.getElementById('start-btn');
        const inGameQuitBtn = document.getElementById('in-game-quit-btn');
        const menuTitle = document.getElementById('menu-title');
        const menuDesc = document.getElementById('menu-desc');
        const aiCommentBox = document.getElementById('ai-comment-box');
        const aiMsg = document.getElementById('ai-msg');

        let width, height;
        let player = { x: 0, y: 0, w: 44, h: 54, speed: 7 };
        let missiles = [];
        let particles = [];
        let stars = [];
        let score = 0;
        let highScore = localStorage.getItem('airplane_dodge_highscore') || 0;
        let gameRunning = false;
        let frameCount = 0;

        highscoreText.innerText = highScore;

        const keys = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false, KeyW: false, KeyA: false, KeyS: false, KeyD: false };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            player.x = width / 2 - player.w / 2;
            player.y = height - 120;
            initStars();
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < 70; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 3 + 1
                });
            }
        }

        window.addEventListener('resize', resize);
        resize();

        // Keyboard controls
        window.addEventListener('keydown', (e) => {
            if (e.code in keys || e.key in keys) {
                keys[e.code] = true;
                keys[e.key] = true;
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.code in keys || e.key in keys) {
                keys[e.code] = false;
                keys[e.key] = false;
            }
        });

        // Touch control buttons
        document.querySelectorAll('.touch-btn').forEach(btn => {
            const key = btn.getAttribute('data-key');
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            btn.addEventListener('mousedown', () => { keys[key] = true; });
            btn.addEventListener('mouseup', () => { keys[key] = false; });
        });

        function addExplosion(x, y, count = 25) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 1;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 4 + 2,
                    color: ['#ff4500', '#ffa500', '#ffff00', '#ffffff'][Math.floor(Math.random() * 4)],
                    life: 30 + Math.random() * 20
                });
            }
        }

        function drawFighterJet(x, y, w, h) {
            ctx.save();
            ctx.translate(x + w / 2, y + h / 2);

            // Engine Thrust Flame
            const flameLen = 14 + Math.random() * 10;
            const flameGrad = ctx.createLinearGradient(0, h / 2 - 4, 0, h / 2 - 4 + flameLen);
            flameGrad.addColorStop(0, '#60a5fa');
            flameGrad.addColorStop(0.4, '#3b82f6');
            flameGrad.addColorStop(1, 'rgba(59, 130, 246, 0)');
            ctx.fillStyle = flameGrad;
            ctx.beginPath();
            ctx.moveTo(-6, h / 2 - 4);
            ctx.lineTo(6, h / 2 - 4);
            ctx.lineTo(0, h / 2 - 4 + flameLen);
            ctx.closePath();
            ctx.fill();

            // Main Delta Wings
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.moveTo(0, -h / 2);
            ctx.lineTo(w / 2, h / 2 - 8);
            ctx.lineTo(w / 4, h / 2 - 12);
            ctx.lineTo(-w / 4, h / 2 - 12);
            ctx.lineTo(-w / 2, h / 2 - 8);
            ctx.closePath();
            ctx.fill();

            // Wings accent lines
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, -h / 3);
            ctx.lineTo(w / 2 - 4, h / 2 - 10);
            ctx.moveTo(0, -h / 3);
            ctx.lineTo(-w / 2 + 4, h / 2 - 10);
            ctx.stroke();

            // Fuselage / Jet Body
            const bodyGrad = ctx.createLinearGradient(-10, 0, 10, 0);
            bodyGrad.addColorStop(0, '#0284c7');
            bodyGrad.addColorStop(0.5, '#38bdf8');
            bodyGrad.addColorStop(1, '#0284c7');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.moveTo(0, -h / 2 - 4);
            ctx.lineTo(7, -h / 6);
            ctx.lineTo(7, h / 2 - 4);
            ctx.lineTo(-7, h / 2 - 4);
            ctx.lineTo(-7, -h / 6);
            ctx.closePath();
            ctx.fill();

            // Cockpit Glass Glow
            const cockpitGrad = ctx.createLinearGradient(0, -h / 3, 0, 0);
            cockpitGrad.addColorStop(0, '#e0f2fe');
            cockpitGrad.addColorStop(0.7, '#0284c7');
            ctx.fillStyle = cockpitGrad;
            ctx.beginPath();
            ctx.ellipse(0, -h / 6, 4, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            // Wingtip Navigation Lights
            ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(-w / 2 + 2, h / 2 - 9, 2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#22c55e'; ctx.beginPath(); ctx.arc(w / 2 - 2, h / 2 - 9, 2, 0, Math.PI * 2); ctx.fill();

            ctx.restore();
        }

        function drawMissile(m) {
            ctx.save();
            ctx.translate(m.x + m.w / 2, m.y + m.h / 2);

            // Tail Exhaust Smoke/Flame
            const flameHeight = 10 + Math.random() * 6;
            const flameGrad = ctx.createLinearGradient(0, -m.h / 2, 0, -m.h / 2 - flameHeight);
            flameGrad.addColorStop(0, '#fde047');
            flameGrad.addColorStop(0.5, '#f97316');
            flameGrad.addColorStop(1, 'rgba(239, 68, 68, 0)');
            ctx.fillStyle = flameGrad;
            ctx.beginPath();
            ctx.moveTo(-4, -m.h / 2);
            ctx.lineTo(4, -m.h / 2);
            ctx.lineTo(0, -m.h / 2 - flameHeight);
            ctx.closePath();
            ctx.fill();

            // Missile Metallic Body
            const bodyGrad = ctx.createLinearGradient(-m.w / 2, 0, m.w / 2, 0);
            bodyGrad.addColorStop(0, '#475569');
            bodyGrad.addColorStop(0.5, '#f8fafc');
            bodyGrad.addColorStop(1, '#475569');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.rect(-m.w / 3, -m.h / 2 + 6, (m.w * 2) / 3, m.h - 10);
            ctx.fill();

            // Red Warhead Tip
            ctx.fillStyle = '#dc2626';
            ctx.beginPath();
            ctx.moveTo(0, m.h / 2 + 2);
            ctx.lineTo(m.w / 3, m.h / 2 - 6);
            ctx.lineTo(-m.w / 3, m.h / 2 - 6);
            ctx.closePath();
            ctx.fill();

            // Tail Fins
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.moveTo(-m.w / 3, -m.h / 2 + 10); ctx.lineTo(-m.w / 2 - 2, -m.h / 2 + 2); ctx.lineTo(-m.w / 3, -m.h / 2 + 18);
            ctx.moveTo(m.w / 3, -m.h / 2 + 10); ctx.lineTo(m.w / 2 + 2, -m.h / 2 + 2); ctx.lineTo(m.w / 3, -m.h / 2 + 18);
            ctx.fill();

            ctx.restore();
        }

        function update() {
            if (!gameRunning) return;

            frameCount++;

            // Movement logic
            if ((keys.ArrowLeft || keys.KeyA) && player.x > 0) player.x -= player.speed;
            if ((keys.ArrowRight || keys.KeyD) && player.x < width - player.w) player.x += player.speed;
            if ((keys.ArrowUp || keys.KeyW) && player.y > 0) player.y -= player.speed;
            if ((keys.ArrowDown || keys.KeyS) && player.y < height - player.h) player.y += player.speed;

            // Spawn missiles based on difficulty scaling
            const spawnRate = Math.max(0.03, 0.08 - (score / 15000));
            if (Math.random() < spawnRate) {
                const speed = 4 + Math.random() * 3 + (score / 500);
                missiles.push({
                    x: Math.random() * (width - 24),
                    y: -60,
                    w: 22,
                    h: 46,
                    speed: speed
                });
            }

            // Update stars
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > height) star.y = 0;
            });

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Update missiles & check collision
            for (let i = missiles.length - 1; i >= 0; i--) {
                const m = missiles[i];
                m.y += m.speed;

                // Smoke trail particles
                if (frameCount % 2 === 0) {
                    particles.push({
                        x: m.x + m.w / 2,
                        y: m.y - 4,
                        vx: (Math.random() - 0.5) * 1,
                        vy: -Math.random() * 2,
                        size: Math.random() * 3 + 1,
                        color: 'rgba(203, 213, 225, 0.5)',
                        life: 15
                    });
                }

                // Dodged missile score
                if (m.y > height) {
                    missiles.splice(i, 1);
                    score += 10;
                    scoreText.innerText = score;
                }

                // Hitbox collision check
                const padding = 6;
                if (
                    m.x + padding < player.x + player.w - padding &&
                    m.x + m.w - padding > player.x + padding &&
                    m.y + padding < player.y + player.h - padding &&
                    m.y + m.h - padding > player.y + padding
                ) {
                    addExplosion(player.x + player.w / 2, player.y + player.h / 2, 40);
                    endGame('lose');
                    break;
                }
            }

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // Draw Stars
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Missiles & Player
            missiles.forEach(m => drawMissile(m));
            drawFighterJet(player.x, player.y, player.w, player.h);
        }

        async function fetchAICommentary(reason, finalScore) {
            aiCommentBox.classList.remove('hidden');
            aiMsg.innerText = "🤖 AI 관제탑에서 회피 기록 분석 중...";

            const situation = reason === 'lose' ? '미사일에 적격당해 작전 실패했습니다' : '작전을 중도 포기하고 이탈했습니다';
            const prompt = `전투기 회피 게임에서 플레이어가 ${situation}. 최종 점수는 ${finalScore}점입니다. 유머러스하고 재치있는 1~2문장의 짧은 한국어 관제탑 AI 코멘트를 작성해주세요.`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: "짧고 간결하게 재미있는 유머 중계 코멘트만 텍스트로 출력하세요." }] }
            };

            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.candidates && result.candidates[0].content.parts[0].text) {
                    aiMsg.innerText = `📻 "${result.candidates[0].content.parts[0].text.trim()}"`;
                } else {
                    aiMsg.innerText = "📻 '관제탑: 다음엔 부디 회피 기동을 잘 해보게!'";
                }
            } catch (err) {
                aiMsg.innerText = "📻 '통신 상태 불량으로 관제 메시지를 수신하지 못했습니다.'";
            }
        }

        function endGame(reason) {
            gameRunning = false;
            hud.classList.add('hidden');

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('airplane_dodge_highscore', highScore);
                highscoreText.innerText = highScore;
            }

            if (reason === 'lose') {
                menuTitle.innerText = "작전 실패 (GAME OVER)";
                menuDesc.innerText = `최종 점수: ${score}점`;
            } else {
                menuTitle.innerText = "작전 이탈 (GIVEN UP)";
                menuDesc.innerText = `획득 점수: ${score}점`;
            }

            startBtn.innerText = "다시 도전하기 🚀";
            ui.classList.remove('hidden');

            fetchAICommentary(reason, score);
        }

        startBtn.addEventListener('click', () => {
            score = 0;
            scoreText.innerText = score;
            missiles = [];
            particles = [];
            player.x = width / 2 - player.w / 2;
            player.y = height - 120;
            gameRunning = true;
            ui.classList.add('hidden');
            hud.classList.remove('hidden');
            update();
        });

        inGameQuitBtn.addEventListener('click', () => {
            if (gameRunning) {
                endGame('quit');
            }
        });
    </script>
    
<style>
    .nav-switch-container {
        display: flex;
        justify-content: center;
        margin: 20px 0;
    }
    .nav-switch {
        display: flex;
        background-color: #e0e0e0;
        border-radius: 25px;
        overflow: hidden;
        width: 240px;
    }
    .nav-switch a {
        flex: 1;
        text-align: center;
        padding: 10px 0;
        text-decoration: none;
        color: #333;
        font-weight: bold;
        transition: background-color 0.3s, color 0.3s;
    }
    .nav-switch a.active {
        background-color: #007bff;
        color: white;
    }
</style>

<div class="nav-switch-container">
    <div class="nav-switch">
        <a href="index.html">Main</a>
        <a href="sub.html" class="active">Sub</a>
    </div>
</div>

</body>
</html>
