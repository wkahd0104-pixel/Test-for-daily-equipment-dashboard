                address: '강원특별자치도 속초시 엑스포로 75',
                distance: '속초고속터미널 차량 5분',
                rating: 4.3,
                tags: ['바닥분수', '청초호', '야간조명', '무료'],
                emoji: '⛲',
                color: 'from-sky-400 to-blue-500',
                openHours: '여름철 정해진 가동 시간 운영',
                url: 'https://www.sokchotour.com/',
                reviews: [
                    { author: '윤*경 (4세 맘)', rating: 5, date: '2026.07.25', text: '속초 여행 와서 들렀는데 아이가 바다보다 여길 더 좋아해요 ㅋㅋ 밤에는 조명 들어와서 예쁩니다.' },
                    { author: '송*우 (6세 대디)', rating: 4, date: '2026.07.14', text: '주변에 잔디밭이 있어서 돗자리 펴놓고 어른들은 쉬고 아이들은 뛰어놀기 완벽합니다.' }
                ]
            }
        ];

        const categories = [
            { id: 'all', name: '전체보기', emoji: '🔍' },
            { id: 'waterpark', name: '대형 워터파크', emoji: '🎢' },
            { id: 'farm', name: '자연/농원 수영장', emoji: '🏕️' },
            { id: 'free', name: '무료/도심 물놀이장', emoji: '⛲' }
        ];

        let currentCategory = 'all';
        let currentRegion = 'cheonan';

        // DOM Elements
        const categoryContainer = document.getElementById('category-container');
        const placesGrid = document.getElementById('places-grid');
        const noResults = document.getElementById('no-results');

        // 지역 변경 핸들러
        function setRegion(regionId) {
            currentRegion = regionId;
            renderPlaces();
        }

        // 카테고리 렌더링
        function renderCategories() {
            categoryContainer.innerHTML = categories.map(cat => {
                const isActive = currentCategory === cat.id;
                return `
                    <button onclick="setCategory('${cat.id}')" 
                        class="flex-shrink-0 flex items-center gap-2 px-5 py-3 rounded-full font-bold text-sm transition-all shadow-sm border ${
                            isActive 
                            ? 'bg-cyan-500 text-white border-cyan-500 shadow-cyan-200' 
                            : 'bg-white text-slate-600 border-slate-200 hover:bg-cyan-50'
                        }">
                        <span class="text-lg">${cat.emoji}</span> ${cat.name}
                    </button>
                `;
            }).join('');
        }

        // 카드 렌더링
        function renderPlaces() {
            const filteredPlaces = placesData.filter(place => {
                const matchRegion = place.region === currentRegion;
                const matchCategory = currentCategory === 'all' || place.category === currentCategory;
                return matchRegion && matchCategory;
            });

            if (filteredPlaces.length === 0) {
                placesGrid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            
            placesGrid.innerHTML = filteredPlaces.map(place => `
                <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 card-hover cursor-pointer flex flex-col h-full" onclick="openModal(${place.id})">
                    <div class="w-full h-40 rounded-2xl mb-4 bg-gradient-to-br ${place.color} flex items-center justify-center text-6xl shadow-inner">
                        ${place.emoji}
                    </div>
                    
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-bold text-xl text-slate-800 line-clamp-1">${place.name}</h3>
                        <div class="flex items-center gap-1 text-sm font-bold text-yellow-500 bg-yellow-50 px-2 py-1 rounded-lg">
                            ⭐ ${place.rating}
                        </div>
                    </div>
                    
                    <p class="text-sm text-slate-500 mb-3 flex items-center gap-1">
                        📍 ${place.distance}
                    </p>
                    
                    <div class="flex flex-wrap gap-1.5 mb-4">
                        ${place.tags.map(tag => `<span class="bg-cyan-50 text-cyan-600 text-xs font-bold px-2.5 py-1 rounded-md">#${tag}</span>`).join('')}
                    </div>
                    
                    <div class="mt-auto pt-4 border-t border-slate-100 flex items-center justify-between text-slate-400 text-sm font-medium group">
                        자세히 보기 
                        <span class="text-cyan-500 transform group-hover:translate-x-1 transition-transform">→</span>
                    </div>
                </div>
            `).join('');
        }

        // 카테고리 변경 핸들러
        function setCategory(categoryId) {
            currentCategory = categoryId;
            renderCategories();
            renderPlaces();
        }

        const modal = document.getElementById('place-modal');
        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalPanel = document.getElementById('modal-panel');

        function openModal(id) {
            const place = placesData.find(p => p.id === id);
            if (!place) return;

            // 모달 데이터 채우기
            document.getElementById('modal-emoji-bg').className = `w-full h-48 flex items-center justify-center text-7xl bg-gradient-to-br ${place.color}`;
            document.getElementById('modal-emoji-bg').innerText = place.emoji;
            document.getElementById('modal-title').innerText = place.name;
            document.getElementById('modal-rating').innerText = place.rating;
            document.getElementById('modal-address').innerText = place.address;
            document.getElementById('modal-desc').innerText = place.description;
            document.getElementById('modal-hours').innerText = place.openHours;
            document.getElementById('modal-distance').innerText = `거리 정보: ${place.distance}`;
            document.getElementById('modal-link').href = place.url;
            
            document.getElementById('modal-tags').innerHTML = place.tags.map(tag => 
                `<span class="bg-slate-100 text-slate-600 text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-200">#${tag}</span>`
            ).join('');

            // 리뷰 데이터 렌더링
            document.getElementById('modal-reviews').innerHTML = place.reviews.map(review => `
                <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="font-bold text-sm text-slate-700">${review.author}</span>
                        <span class="text-xs text-slate-400">${review.date}</span>
                    </div>
                    <div class="text-yellow-400 text-xs mb-2">
                        ${'★'.repeat(review.rating)}${'☆'.repeat(5-review.rating)}
                    </div>
                    <p class="text-slate-600 text-sm leading-relaxed">${review.text}</p>
                </div>
            `).join('');

            // 모달 표시 (애니메이션 적용)
            modal.classList.remove('hidden');
            // 강제 리플로우를 발생시켜 애니메이션 트리거
            void modal.offsetWidth; 
            
            modalBackdrop.classList.remove('opacity-0');
            modalPanel.classList.remove('opacity-0', 'translate-y-4', 'sm:scale-95');
            modalPanel.classList.add('opacity-100', 'translate-y-0', 'sm:scale-100');
            
            // 바디 스크롤 방지
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            // 사라지는 애니메이션
            modalBackdrop.classList.add('opacity-0');
            modalPanel.classList.remove('opacity-100', 'translate-y-0', 'sm:scale-100');
            modalPanel.classList.add('opacity-0', 'translate-y-4', 'sm:scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = ''; // 바디 스크롤 복구
            }, 300); // Tailwind의 transition-all 기본 시간과 맞춤
        }

        // 모달 외부 클릭 시 닫기
        modal.addEventListener('click', (e) => {
            if (e.target === modal.firstElementChild || e.target === modalBackdrop) {
                closeModal();
            }
        });

        // 초기화
        window.onload = () => {
            renderCategories();
            renderPlaces();
        };
    </script>
</body>
